name: Deploy handbook to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [handbooks-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out handbook content
        uses: actions/checkout@v6
        with:
          repository: syndreno/handbooks
          ref: main
          path: .cache/handbook-repository
          token: ${{ secrets.HANDBOOKS_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Build static site and search index
        run: npm run build
        env:
          HANDBOOK_SKIP_SYNC: "1"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
